name: CI & Deploy

concurrency:
  group: menu-pictures-production
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Build check
        run: npm run build

      - name: Smoke test production server
        run: npm run smoke:production

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 97.74.93.177
          username: stijn
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            cd /var/www/menu-pictures
            exec 9>/tmp/menu-pictures-deploy.lock
            flock -w 300 9

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            if ! npm ci; then
              echo "Dependency tree is damaged; quarantining and reinstalling..."
              rm -rf /var/www/menu-pictures/node_modules.corrupt
              if [ -d /var/www/menu-pictures/node_modules ]; then
                mv /var/www/menu-pictures/node_modules /var/www/menu-pictures/node_modules.corrupt
              fi
              npm ci
              rm -rf /var/www/menu-pictures/node_modules.corrupt
            fi

            echo "Building..."
            npm run build

            echo "Restarting..."
            pm2 startOrReload ecosystem.config.cjs --only menu-pictures

            echo "Verifying deployment..."
            healthy=false
            for attempt in $(seq 1 20); do
              if curl -sf http://localhost:3005/api/health > /dev/null \
                && curl -sf http://localhost:3005/ | grep -q '<title>menu.pictures</title>'; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              pm2 logs menu-pictures --lines 80 --nostream || true
              exit 1
            fi

            pm2 save
            echo "Health check passed. Deployed successfully."
