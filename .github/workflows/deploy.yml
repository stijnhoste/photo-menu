name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Build check
        run: npm run build

      - name: Smoke test production server
        run: npm run smoke:production

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 97.74.93.177
          username: stijn
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/menu-pictures
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREVIOUS_COMMIT"
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            echo "Installing dependencies..."
            npm ci
            echo "Building..."
            npm run build
            echo "Restarting..."
            pm2 startOrReload ecosystem.config.cjs --only menu-pictures
            echo "Waiting for app to start..."
            sleep 5
            echo "Verifying deployment..."
            if curl -sf http://localhost:3005/api/health > /dev/null \
              && curl -sf http://localhost:3005/ | grep -q '<title>menu.pictures</title>'; then
              pm2 save
              echo "Health check passed!"
              echo "Deployed successfully!"
            else
              echo "Health check failed! Rolling back..."
              git reset --hard $PREVIOUS_COMMIT
              npm ci
              npm run build
              NODE_ENV=production pm2 restart menu-pictures --update-env
              echo "Rolled back to $PREVIOUS_COMMIT"
              exit 1
            fi
